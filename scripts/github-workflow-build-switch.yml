name: Build Switch NRO

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang libsdl2-dev libsdl2-ttf-dev libfreetype-dev libgles-dev xvfb libgl1-mesa-dri fonts-noto-cjk

      - name: Build (Linux, same sources)
        run: |
          CC=clang CXX=clang++ cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Host tests (SoftFloat, thbgm stream, SDL2_ttf glyphs, GLES renderer)
        run: xvfb-run -a -s "-screen 0 1280x960x24" ./build/th08_host_tests

  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          apt-get update -qq
          apt-get install -y -qq cmake ninja-build git python3

      - name: Build
        env:
          DEVKITPRO: /opt/devkitpro
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          chmod +x scripts/build_switch.sh
          ./scripts/build_switch.sh

      - name: Show result
        run: ls -lh build-switch/touhou8.nro

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: touhou8-switch
          path: build-switch/touhou8.nro
          if-no-files-found: error

      # Tagged pushes additionally publish the NRO as a release asset.
      - name: Checksum
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd build-switch
          sha256sum touhou8.nro > touhou8.nro.sha256

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build-switch/touhou8.nro
            build-switch/touhou8.nro.sha256
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
